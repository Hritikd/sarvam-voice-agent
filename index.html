<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; max-width:600px; margin:60px auto; text-align:center;">
  <h2>Sarvam Voice Agent — Phase 3</h2>
  <button id="btn" style="font-size:1.2rem; padding:12px 28px;">🎙️ Start recording</button>
  <p id="status"></p>
  <div id="result" style="font-size:1.1rem; margin-top:24px; text-align:left;"></div>
  <div id="card" style="margin-top:20px;"></div>

<script>
let recorder, chunks = [], recording = false;
const btn = document.getElementById("btn");
const status = document.getElementById("status");
const result = document.getElementById("result");
const card = document.getElementById("card");

btn.onclick = async () => {
  if (!recording) {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = handleAudio;
    recorder.start();
    recording = true;
    btn.textContent = "⏹️ Stop";
    status.textContent = "Recording… speak now";
    card.innerHTML = "";
    result.textContent = "";
  } else {
    recorder.stop();
    recording = false;
    btn.textContent = "🎙️ Start recording";
    status.textContent = "Transcribing…";
  }
};

async function handleAudio() {
  const blob = new Blob(chunks, { type: "audio/wav" });
  const form = new FormData();
  form.append("audio", blob, "recording.wav");
  const res = await fetch("/transcribe", { method: "POST", body: form });
  const data = await res.json();
  const transcript = data.transcript || JSON.stringify(data);
  result.textContent = "You said: " + transcript;

  status.textContent = "Understanding…";
  const uRes = await fetch("/understand", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: transcript })
  });
  const uData = await uRes.json();
  status.textContent = "";
  showIntent(uData);
}

function showIntent(uData) {
  if (uData.intent) {
    const i = uData.intent;
    card.innerHTML =
      '<div style="display:inline-block; text-align:left; padding:16px 24px; ' +
      'border:2px solid #333; border-radius:12px; font-size:1.2rem;">' +
      '<b>Action:</b> ' + i.action + '<br>' +
      '<b>Day:</b> ' + i.day + '<br>' +
      '<b>Time:</b> ' + i.time +
      '</div>';
  } else {
    card.innerHTML =
      '<div style="color:#b00;">Could not extract intent.<br>' +
      '<small>Raw model reply: ' + JSON.stringify(uData.raw) + '</small></div>';
  }
}
</script>
</body>
</html>
